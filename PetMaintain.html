<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛小孩資料維護</title>
    <link rel="preconnect" href="https://script.google.com">
    <script src="config.js"></script>
    <!-- 引入共用外觀樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>毛小孩資料維護</h2>

        <!-- 優化後的讀取畫面 -->
        <div id="loading-overlay" class="is-visible">
            <div class="spinner"></div>
            <div class="loading-text">資料讀取中，請稍候...</div>
        </div>

        <!-- 寵物清單模式：顯示會員名下所有毛小孩，可新增或點選編輯 -->
        <div id="petListView" style="display: none;">
            <input type="hidden" id="U_ID">
            <div id="petList" class="pet-list"></div>
            <button type="button" class="btn" onclick="addNewPet()">+ 新增毛小孩</button>
            <button type="button" class="btn btn-secondary" onclick="goBackToCenter()">返回會員中心</button>
        </div>

        <!-- 寵物編輯模式：新增或修改單一毛小孩的基本資料 -->
        <form id="petForm" style="display: none;">
            <input type="hidden" id="P_ID">

            <div class="form-group">
                <label for="P_Name">寵物名稱<span class="required-star">*</span></label>
                <input type="text" id="P_Name" class="form-control" placeholder="請輸入寵物名稱" required>
            </div>

            <div class="form-group">
                <label for="P_Type">寵物類型</label>
                <select id="P_Type" class="form-control" onchange="handlePetTypeChange()">
                    <option value="">請選擇</option>
                </select>
            </div>

            <div class="form-group">
                <label for="P_Breeds">寵物品種</label>
                <select id="P_Breeds" class="form-control">
                    <option value="">請先選擇寵物類型</option>
                </select>
            </div>

            <div class="form-group">
                <label for="P_Sex">性別</label>
                <select id="P_Sex" class="form-control">
                    <option value="">請選擇</option>
                    <option value="男生">男生</option>
                    <option value="女生">女生</option>
                </select>
            </div>

            <div class="form-group">
                <label for="P_Birthday">寵物生日</label>
                <input type="date" id="P_Birthday" class="form-control">
            </div>

            <div class="form-group">
                <div class="flex-group">
                    <div style="flex: 1;">
                        <label for="P_Weight">體重（kg）</label>
                        <input type="number" id="P_Weight" class="form-control" step="0.1" min="0" placeholder="例如：5.2">
                    </div>
                    <div style="flex: 1;">
                        <label for="P_Size_Display">體型</label>
                        <input type="text" id="P_Size_Display" class="form-control" readonly placeholder="請先輸入體重">
                        <input type="hidden" id="P_Size">
                        <span class="field-hint field-hint-block">依體重自動判定</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="P_IC">寵物晶片號碼</label>
                <input type="text" id="P_IC" class="form-control" placeholder="請輸入晶片號碼（選填）">
            </div>

            <div class="form-group">
                <label for="P_Memo">飼主備註</label>
                <textarea id="P_Memo" class="form-control" placeholder="有什麼想讓我們知道的嗎？（過敏、習慣...）"></textarea>
            </div>

            <div class="form-group">
                <label>寵物健康</label>
                <div class="checkbox-container">
                    <label class="checkbox-group"><input type="checkbox" id="PH_None"><span>無疾病</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_CKD"><span>慢性腎衰竭</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_RV"><span>心絲蟲</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_HI"><span>聽力受損</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_VI"><span>視力受損</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_EPI"><span>癲癇</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_CDV"><span>犬瘟熱</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_EHR"><span>艾莉希體</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_PIV"><span>氣管塌陷</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_CARDIO"><span>心臟病</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_ASTH"><span>氣喘（易喘）</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PH_HIP"><span>髖關節問題</span></label>
                    <input type="text" id="PH_HIP_Memo" class="form-control" placeholder="請輸入受傷位置" disabled>
                    <label class="checkbox-group"><input type="checkbox" id="PH_PARA"><span>寄生蟲感染</span></label>
                    <input type="text" id="PH_PARA_Memo" class="form-control" placeholder="請輸入寄生蟲名稱" disabled>
                    <label class="checkbox-group"><input type="checkbox" id="PH_OA"><span>骨骼（骨折）舊傷</span></label>
                    <input type="text" id="PH_OA_Memo" class="form-control" placeholder="請輸入受傷位置" disabled>
                    <label class="checkbox-group"><input type="checkbox" id="PH_AD"><span>皮膚疾病</span></label>
                    <input type="text" id="PH_AD_Memo" class="form-control" placeholder="請輸入疾病名稱或部位" disabled>
                    <label class="checkbox-group"><input type="checkbox" id="PH_Other"><span>其他</span></label>
                    <input type="text" id="PH_Other_Memo" class="form-control" placeholder="請輸入其他健康狀況說明" disabled>
                </div>
            </div>

            <div class="form-group">
                <label>寵物注意事項</label>
                <div class="checkbox-container">
                    <label class="checkbox-group"><input type="checkbox" id="PW_None"><span>無須注意事項</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_ASB"><span>攻擊性</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_WN"><span>不親狗</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_Mani"><span>易緊張</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_SAD"><span>分離焦慮</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_DDS"><span>掙扎</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_PD"><span>不親人</span></label>
                    <label class="checkbox-group"><input type="checkbox" id="PW_BWA"><span>敏感部位</span></label>
                    <input type="text" id="PW_BWA_Memo" class="form-control" placeholder="請輸入敏感部位" disabled>
                    <label class="checkbox-group"><input type="checkbox" id="PW_Other"><span>其他</span></label>
                    <input type="text" id="PW_Other_Memo" class="form-control" placeholder="請輸入其他注意事項說明" disabled>
                </div>
            </div>

            <button type="button" class="btn" id="submitBtn" onclick="submitForm()" disabled>儲存資料</button>
            <button type="button" class="btn btn-secondary" onclick="showListView()">返回清單</button>
        </form>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="#1F6B4D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3 class="modal-title">儲存成功</h3>
            <p class="modal-message" id="successModalMessage">毛小孩的資料已更新完成。</p>
        </div>
    </div>

    <script>
        // 目前該會員名下的寵物清單快取（前端記憶體，切換編輯畫面時直接取用，不用每次都打 API）
        let petListCache = [];
        // 寵物類型代碼對應表（來自 Basic_Data：TB_Name='Pet', Cul_Name='P_Type'）
        // 介面顯示 Code_Desc，資料庫實際存 Code
        let petTypeOptions = [];
        // 寵物品種代碼對應表（來自 Basic_Data：TB_Name='Pet', Cul_Name='P_Breeds'，以寵物類型代碼為前綴篩選）
        // 結構：{ 類型代碼: { 品種代碼: 品種說明, ... }, ... }
        let breedDescCacheByType = {};
        // 體型代碼對應表（來自 Basic_Data：TB_Name='Pet', Cul_Name='P_Size', Flag=TRUE）
        // 體型不再由使用者選擇，改為依體重由系統自動換算
        let petSizeOptions = [];

        const PET_HEALTH_CHECK_FIELDS = ['PH_None', 'PH_CKD', 'PH_RV', 'PH_HI', 'PH_VI', 'PH_EPI', 'PH_CDV', 'PH_EHR', 'PH_PIV', 'PH_CARDIO', 'PH_ASTH', 'PH_HIP', 'PH_PARA', 'PH_OA', 'PH_AD', 'PH_Other'];
        const PET_HEALTH_MEMO_FIELDS = ['PH_HIP_Memo', 'PH_PARA_Memo', 'PH_OA_Memo', 'PH_AD_Memo', 'PH_Other_Memo'];
        const PET_WARINESS_CHECK_FIELDS = ['PW_None', 'PW_ASB', 'PW_WN', 'PW_Mani', 'PW_SAD', 'PW_DDS', 'PW_PD', 'PW_BWA', 'PW_Other'];
        const PET_WARINESS_MEMO_FIELDS = ['PW_BWA_Memo', 'PW_Other_Memo'];
        const PET_HEALTH_MEMO_DEPENDENCIES = {
            PH_HIP_Memo: 'PH_HIP',
            PH_PARA_Memo: 'PH_PARA',
            PH_OA_Memo: 'PH_OA',
            PH_AD_Memo: 'PH_AD',
            PH_Other_Memo: 'PH_Other'
        };
        const PET_WARINESS_MEMO_DEPENDENCIES = {
            PW_BWA_Memo: 'PW_BWA',
            PW_Other_Memo: 'PW_Other'
        };

        const CODE_CACHE_TTL_MS = 30 * 60 * 1000; // 30 分鐘，降低重複查詢雲端代碼檔

        function readCodeCache(key) {
            try {
                const raw = sessionStorage.getItem(key);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.data) || !parsed.at) return null;
                if (Date.now() - parsed.at > CODE_CACHE_TTL_MS) return null;
                return parsed.data;
            } catch (err) {
                return null;
            }
        }

        function writeCodeCache(key, data) {
            try {
                sessionStorage.setItem(key, JSON.stringify({ at: Date.now(), data: data }));
            } catch (err) {
                // sessionStorage 不可用時略過快取
            }
        }

        function getParamFromUrl(paramName) {
            const params = new URLSearchParams(window.location.search);
            return params.get(paramName);
        }

        function validateRequiredFields() {
            const name = document.getElementById('P_Name').value.trim();
            const isValid = !!name;
            document.getElementById('submitBtn').disabled = !isValid;
            return isValid;
        }

        function setCheckboxValue(id, value) {
            const el = document.getElementById(id);
            if (el) {
                el.checked = value === true;
            }
        }

        function getCheckboxValue(id) {
            const el = document.getElementById(id);
            return !!(el && el.checked);
        }

        function setTextValue(id, value) {
            const el = document.getElementById(id);
            if (el) {
                el.value = value || '';
            }
        }

        function getTextValue(id) {
            const el = document.getElementById(id);
            return el ? el.value.trim() : '';
        }

        function setMemoEnabled(memoId, enabled) {
            const memoEl = document.getElementById(memoId);
            if (!memoEl) {
                return;
            }
            memoEl.disabled = !enabled;
            if (!enabled) {
                memoEl.value = '';
            }
        }

        function syncConditionalMemoInputs() {
            Object.keys(PET_HEALTH_MEMO_DEPENDENCIES).forEach(function(memoId) {
                const checkId = PET_HEALTH_MEMO_DEPENDENCIES[memoId];
                setMemoEnabled(memoId, getCheckboxValue(checkId));
            });
            Object.keys(PET_WARINESS_MEMO_DEPENDENCIES).forEach(function(memoId) {
                const checkId = PET_WARINESS_MEMO_DEPENDENCIES[memoId];
                setMemoEnabled(memoId, getCheckboxValue(checkId));
            });
        }

        function setupExclusiveNoneRules() {
            const healthNoneId = 'PH_None';
            const healthOthers = PET_HEALTH_CHECK_FIELDS.filter(function(id) { return id !== healthNoneId; });
            const warinessNoneId = 'PW_None';
            const warinessOthers = PET_WARINESS_CHECK_FIELDS.filter(function(id) { return id !== warinessNoneId; });

            const healthNone = document.getElementById(healthNoneId);
            const warinessNone = document.getElementById(warinessNoneId);

            healthNone.addEventListener('change', function() {
                if (healthNone.checked) {
                    healthOthers.forEach(function(id) { setCheckboxValue(id, false); });
                }
                syncConditionalMemoInputs();
            });

            healthOthers.forEach(function(id) {
                const el = document.getElementById(id);
                el.addEventListener('change', function() {
                    if (el.checked) {
                        setCheckboxValue(healthNoneId, false);
                    }
                    syncConditionalMemoInputs();
                });
            });

            PET_HEALTH_MEMO_FIELDS.forEach(function(memoId) {
                const el = document.getElementById(memoId);
                el.addEventListener('input', function() {
                    if (el.value.trim() !== '') {
                        setCheckboxValue(healthNoneId, false);
                    }
                });
            });

            warinessNone.addEventListener('change', function() {
                if (warinessNone.checked) {
                    warinessOthers.forEach(function(id) { setCheckboxValue(id, false); });
                }
                syncConditionalMemoInputs();
            });

            warinessOthers.forEach(function(id) {
                const el = document.getElementById(id);
                el.addEventListener('change', function() {
                    if (el.checked) {
                        setCheckboxValue(warinessNoneId, false);
                    }
                    syncConditionalMemoInputs();
                });
            });

            PET_WARINESS_MEMO_FIELDS.forEach(function(memoId) {
                const el = document.getElementById(memoId);
                el.addEventListener('input', function() {
                    if (el.value.trim() !== '') {
                        setCheckboxValue(warinessNoneId, false);
                    }
                });
            });

            syncConditionalMemoInputs();
        }

        function fillHealthAndWariness(health, wariness) {
            const healthData = health || {};
            PET_HEALTH_CHECK_FIELDS.forEach(function(id) {
                setCheckboxValue(id, healthData[id] === true);
            });
            PET_HEALTH_MEMO_FIELDS.forEach(function(id) {
                setTextValue(id, healthData[id]);
            });

            const warinessData = wariness || {};
            PET_WARINESS_CHECK_FIELDS.forEach(function(id) {
                setCheckboxValue(id, warinessData[id] === true);
            });
            PET_WARINESS_MEMO_FIELDS.forEach(function(id) {
                setTextValue(id, warinessData[id]);
            });

            syncConditionalMemoInputs();
        }

        function buildHealthPayload() {
            return {
                PH_None: getCheckboxValue('PH_None'),
                PH_CKD: getCheckboxValue('PH_CKD'),
                PH_RV: getCheckboxValue('PH_RV'),
                PH_HI: getCheckboxValue('PH_HI'),
                PH_VI: getCheckboxValue('PH_VI'),
                PH_EPI: getCheckboxValue('PH_EPI'),
                PH_CDV: getCheckboxValue('PH_CDV'),
                PH_EHR: getCheckboxValue('PH_EHR'),
                PH_PIV: getCheckboxValue('PH_PIV'),
                PH_CARDIO: getCheckboxValue('PH_CARDIO'),
                PH_ASTH: getCheckboxValue('PH_ASTH'),
                PH_HIP: getCheckboxValue('PH_HIP'),
                PH_HIP_Memo: getCheckboxValue('PH_HIP') ? getTextValue('PH_HIP_Memo') : '',
                PH_PARA: getCheckboxValue('PH_PARA'),
                PH_PARA_Memo: getCheckboxValue('PH_PARA') ? getTextValue('PH_PARA_Memo') : '',
                PH_OA: getCheckboxValue('PH_OA'),
                PH_OA_Memo: getCheckboxValue('PH_OA') ? getTextValue('PH_OA_Memo') : '',
                PH_AD: getCheckboxValue('PH_AD'),
                PH_AD_Memo: getCheckboxValue('PH_AD') ? getTextValue('PH_AD_Memo') : '',
                PH_Other: getCheckboxValue('PH_Other'),
                PH_Other_Memo: getCheckboxValue('PH_Other') ? getTextValue('PH_Other_Memo') : ''
            };
        }

        function buildWarinessPayload() {
            return {
                PW_None: getCheckboxValue('PW_None'),
                PW_ASB: getCheckboxValue('PW_ASB'),
                PW_WN: getCheckboxValue('PW_WN'),
                PW_Mani: getCheckboxValue('PW_Mani'),
                PW_SAD: getCheckboxValue('PW_SAD'),
                PW_DDS: getCheckboxValue('PW_DDS'),
                PW_PD: getCheckboxValue('PW_PD'),
                PW_BWA: getCheckboxValue('PW_BWA'),
                PW_BWA_Memo: getCheckboxValue('PW_BWA') ? getTextValue('PW_BWA_Memo') : '',
                PW_Other: getCheckboxValue('PW_Other'),
                PW_Other_Memo: getCheckboxValue('PW_Other') ? getTextValue('PW_Other_Memo') : ''
            };
        }

        // 將任意文字安全地轉為可放進 innerHTML 的內容，避免寵物名稱/備註等使用者輸入造成 XSS
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        // 依代碼對應表，將 P_Type 存的 Code 轉成畫面顯示用的 Code_Desc
        function getPetTypeDesc(code) {
            if (!code) {
                return '';
            }
            const found = petTypeOptions.find(function(opt) { return opt.Code === code; });
            return found ? (found.Code_Desc || found.Code) : code;
        }

        // 依代碼對應表動態產生「寵物類型」下拉選項
        function populatePetTypeSelect() {
            const select = document.getElementById('P_Type');
            const currentValue = select.value;
            select.innerHTML = '<option value="">請選擇</option>';
            petTypeOptions.forEach(function(opt) {
                const optionEl = document.createElement('option');
                optionEl.value = opt.Code;
                optionEl.textContent = opt.Code_Desc || opt.Code;
                select.appendChild(optionEl);
            });
            select.value = currentValue;
        }

        // 讀取「寵物類型」代碼對應檔 (Basic_Data: TB_Name='Pet', Cul_Name='P_Type')
        async function loadPetTypeOptions() {
            const cached = readCodeCache('pps_pet_type_options');
            if (cached) {
                petTypeOptions = cached;
                populatePetTypeSelect();
                return;
            }

            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=getCodeList&tbName=Pet&culName=P_Type`);
                const result = await response.json();

                if (result.success) {
                    petTypeOptions = Array.isArray(result.data) ? result.data : [];
                    writeCodeCache('pps_pet_type_options', petTypeOptions);
                } else {
                    console.error('讀取寵物類型代碼失敗:', result.error);
                    petTypeOptions = [];
                }
            } catch (error) {
                console.error('讀取寵物類型代碼時發生網路錯誤:', error);
                petTypeOptions = [];
            } finally {
                populatePetTypeSelect();
            }
        }

        // 依「寵物類型」代碼，讀取（並快取）該類型底下的品種代碼對應表 (Basic_Data: TB_Name='Pet', Cul_Name='P_Breeds', code第一碼=類型代碼)
        async function loadAllBreedOptions() {
            const cached = readCodeCache('pps_pet_breeds_all');
            if (cached) {
                breedDescCacheByType = {};
                cached.forEach(function(opt) {
                    if (!opt || !opt.Code) {
                        return;
                    }
                    const typeCode = String(opt.Code).substring(0, 1);
                    if (!typeCode) {
                        return;
                    }
                    if (!breedDescCacheByType[typeCode]) {
                        breedDescCacheByType[typeCode] = {};
                    }
                    breedDescCacheByType[typeCode][opt.Code] = opt.Code_Desc || opt.Code;
                });
                return;
            }

            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=getCodeList&tbName=Pet&culName=P_Breeds`);
                const result = await response.json();

                breedDescCacheByType = {};
                if (result.success && Array.isArray(result.data)) {
                    result.data.forEach(function(opt) {
                        if (!opt || !opt.Code) {
                            return;
                        }
                        const typeCode = String(opt.Code).substring(0, 1);
                        if (!typeCode) {
                            return;
                        }
                        if (!breedDescCacheByType[typeCode]) {
                            breedDescCacheByType[typeCode] = {};
                        }
                        breedDescCacheByType[typeCode][opt.Code] = opt.Code_Desc || opt.Code;
                    });
                    writeCodeCache('pps_pet_breeds_all', result.data);
                } else {
                    console.error('讀取寵物品種代碼失敗:', result.error);
                }
            } catch (error) {
                console.error('讀取寵物品種代碼時發生網路錯誤:', error);
                breedDescCacheByType = {};
            }
        }

        // 依代碼對應表，將 P_Breeds 存的 Code 轉成畫面顯示用的 Code_Desc
        function getBreedDesc(typeCode, breedCode) {
            if (!breedCode) {
                return '';
            }
            const map = breedDescCacheByType[typeCode] || {};
            return map[breedCode] || breedCode;
        }

        // 依選定的寵物類型，重新產生「寵物品種」下拉選項；selectedBreedCode 用於編輯既有寵物時帶回原本的選擇
        async function populateBreedSelect(typeCode, selectedBreedCode) {
            const select = document.getElementById('P_Breeds');

            if (!typeCode) {
                select.innerHTML = '<option value="">請先選擇寵物類型</option>';
                return;
            }

            select.innerHTML = '<option value="">請選擇</option>';

            const map = breedDescCacheByType[typeCode] || {};
            Object.keys(map).sort().forEach(function(code) {
                const optionEl = document.createElement('option');
                optionEl.value = code;
                optionEl.textContent = map[code];
                select.appendChild(optionEl);
            });

            select.value = selectedBreedCode || '';
        }

        // 使用者切換「寵物類型」時，品種選項需重新載入且清空原本選擇（避免帶著舊類型的品種代碼）
        async function handlePetTypeChange() {
            const typeCode = document.getElementById('P_Type').value;
            await populateBreedSelect(typeCode, '');
        }

        // 預先載入清單中所有毛小孩「所屬類型」的品種對應表，讓清單卡片能正確顯示品種名稱
        async function preloadBreedDescForList() {
            // 品種代碼已在進頁面時一次載入完成，這裡保留函式以維持呼叫相容性
            return;
        }

        // 依體重換算體型代碼：<=4kg→1，4~10kg→2，10~25kg→3，>=25kg→4
        function calcPetSizeCode(weight) {
            if (weight === null || weight === undefined || isNaN(weight)) {
                return '';
            }
            if (weight <= 4) {
                return '1';
            }
            if (weight <= 10) {
                return '2';
            }
            if (weight < 25) {
                return '3';
            }
            return '4';
        }

        // 依代碼對應表，將 P_Size 存的 Code 轉成畫面顯示用的 Code_Desc
        function getPetSizeDesc(code) {
            if (!code) {
                return '';
            }
            const found = petSizeOptions.find(function(opt) { return opt.Code === code; });
            return found ? (found.Code_Desc || found.Code) : code;
        }

        // 讀取「體型」代碼對應檔 (Basic_Data: TB_Name='Pet', Cul_Name='P_Size', Flag=TRUE)
        async function loadPetSizeOptions() {
            const cached = readCodeCache('pps_pet_size_options');
            if (cached) {
                petSizeOptions = cached;
                recalcPetSize();
                return;
            }

            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=getCodeList&tbName=Pet&culName=P_Size&onlyEnabled=true`);
                const result = await response.json();

                if (result.success) {
                    petSizeOptions = Array.isArray(result.data) ? result.data : [];
                    writeCodeCache('pps_pet_size_options', petSizeOptions);
                    if (petSizeOptions.length === 0) {
                        // 查無代碼資料，體型欄位會退回顯示原始代碼數字；請確認 Basic_Data 是否已建立對應資料且 Flag=TRUE
                        console.warn('Basic_Data 查無 TB_Name=Pet, Cul_Name=P_Size, Flag=TRUE 的資料，體型將只顯示代碼數字。');
                    }
                } else {
                    console.error('讀取寵物體型代碼失敗:', result.error);
                    petSizeOptions = [];
                }
            } catch (error) {
                console.error('讀取寵物體型代碼時發生網路錯誤:', error);
                petSizeOptions = [];
            } finally {
                recalcPetSize();
            }
        }

        // 依目前「體重」欄位的值，重新計算並顯示「體型」(隱藏欄位存 Code，顯示欄位顯示 Code_Desc)
        function recalcPetSize() {
            const weightRaw = document.getElementById('P_Weight').value;
            const weight = weightRaw !== '' ? parseFloat(weightRaw) : null;
            const code = calcPetSizeCode(weight);
            document.getElementById('P_Size').value = code;
            document.getElementById('P_Size_Display').value = code ? getPetSizeDesc(code) : '';
        }

        function showListView() {
            document.getElementById('petForm').style.display = 'none';
            document.getElementById('petListView').style.display = 'block';
        }

        function showFormView() {
            document.getElementById('petListView').style.display = 'none';
            document.getElementById('petForm').style.display = 'block';
        }

        function goBackToCenter() {
            window.location.replace('CustomerCenter.html');
        }

        function resetForm() {
            document.getElementById('P_ID').value = '';
            document.getElementById('P_Name').value = '';
            document.getElementById('P_Type').value = '';
            document.getElementById('P_Breeds').innerHTML = '<option value="">請先選擇寵物類型</option>';
            document.getElementById('P_Sex').value = '';
            document.getElementById('P_Birthday').value = '';
            document.getElementById('P_Weight').value = '';
            document.getElementById('P_IC').value = '';
            document.getElementById('P_Memo').value = '';
            fillHealthAndWariness(null, null);
            recalcPetSize();
        }

        function addNewPet() {
            resetForm();
            validateRequiredFields();
            showFormView();
        }

        function editPet(petId) {
            const pet = petListCache.find(function(p) { return p.P_ID === petId; });
            if (!pet) {
                return;
            }

            document.getElementById('P_ID').value = pet.P_ID || '';
            document.getElementById('P_Name').value = pet.P_Name || '';
            document.getElementById('P_Type').value = pet.P_Type || '';
            document.getElementById('P_Sex').value = pet.P_Sex || '';
            document.getElementById('P_Weight').value = (pet.P_Weight !== null && pet.P_Weight !== undefined) ? pet.P_Weight : '';
            document.getElementById('P_IC').value = pet.P_IC || '';
            document.getElementById('P_Memo').value = pet.P_Memo || '';
            document.getElementById('P_Birthday').value = pet.P_Birthday ? pet.P_Birthday.substring(0, 10) : '';
            fillHealthAndWariness(pet.Pet_Health, pet.Pet_Wariness);
            recalcPetSize();

            populateBreedSelect(pet.P_Type, pet.P_Breeds).then(function() {
                validateRequiredFields();
                showFormView();
            });
        }

        function renderPetList() {
            const container = document.getElementById('petList');
            container.innerHTML = '';

            if (petListCache.length === 0) {
                container.innerHTML = '<div class="pet-list-empty">目前尚未建立任何毛小孩資料，點選下方按鈕新增第一隻吧！</div>';
                return;
            }

            petListCache.forEach(function(pet) {
                const card = document.createElement('div');
                card.className = 'pet-card';
                card.onclick = function() { editPet(pet.P_ID); };

                const subText = [getPetTypeDesc(pet.P_Type), getBreedDesc(pet.P_Type, pet.P_Breeds)].filter(Boolean).join(' ‧ ') || '尚未填寫類型/品種';

                card.innerHTML =
                    '<div class="pet-card-info">' +
                        '<span class="pet-card-name">' + escapeHtml(pet.P_Name || '未命名') + '</span>' +
                        '<span class="pet-card-sub">' + escapeHtml(subText) + '</span>' +
                    '</div>' +
                    '<span class="pet-card-arrow">&rsaquo;</span>';

                container.appendChild(card);
            });
        }

        async function loadPetList() {
            document.getElementById('loading-overlay').classList.add('is-visible');
            document.getElementById('petListView').style.display = 'none';
            document.getElementById('petForm').style.display = 'none';

            const uid = document.getElementById('U_ID').value;

            // 逾時保護：後端(GAS 冷啟動 / Supabase 喚醒)偶爾會回應緩慢，避免使用者無限等待
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=getPetList&uid=${encodeURIComponent(uid)}`, { signal: controller.signal });
                const result = await response.json();

                if (result.success) {
                    petListCache = Array.isArray(result.data) ? result.data : [];
                } else {
                    console.error('讀取毛小孩清單失敗:', result.error);
                    alert('讀取毛小孩資料時發生問題：\n' + (result.error || '未知錯誤'));
                    petListCache = [];
                }

                await preloadBreedDescForList();
            } catch (error) {
                console.error("資料讀取失敗:", error);
                const isTimeout = error.name === 'AbortError';
                alert((isTimeout ? '讀取毛小孩清單逾時（伺服器回應過久），' : '讀取毛小孩清單時發生網路錯誤，') + '請確認網路狀況後重新整理再試一次。');
                petListCache = [];
            } finally {
                clearTimeout(timeoutId);
                renderPetList();
                document.getElementById('loading-overlay').classList.remove('is-visible');
                showListView();
            }
        }

        window.onload = async function() {
            document.getElementById('P_Name').addEventListener('input', validateRequiredFields);
            document.getElementById('P_Name').addEventListener('change', validateRequiredFields);
            document.getElementById('P_Weight').addEventListener('input', recalcPetSize);
            document.getElementById('P_Weight').addEventListener('change', recalcPetSize);
            setupExclusiveNoneRules();

            const uid = getParamFromUrl('uid');

            if (!uid) {
                document.getElementById('loading-overlay').innerHTML = "<div class='loading-text is-error'>無法取得系統授權碼，請從 LINE 重新進入</div>";
                document.getElementById('loading-overlay').classList.add('is-visible');
                return;
            }

            document.getElementById('U_ID').value = uid;

            // 代碼對應表（類型/體型）跟寵物清單彼此沒有相依性，一開始就同時送出請求，
            // 不用等代碼表載入完才開始查清單，減少等待時間（尤其 GAS 冷啟動時更明顯）
            const petListPromise = loadPetList();
            await Promise.all([loadPetTypeOptions(), loadAllBreedOptions(), loadPetSizeOptions(), petListPromise]);

            // 代碼表有可能比清單晚回來，此時清單卡片裡的類型/品種文字還沒對應好，
            // 全部載入完成後再重新渲染一次，確保顯示正確
            renderPetList();
        };

        async function submitForm() {
            const uid = document.getElementById('U_ID').value;
            const petId = document.getElementById('P_ID').value;
            const name = document.getElementById('P_Name').value.trim();
            const type = document.getElementById('P_Type').value;
            const breeds = document.getElementById('P_Breeds').value;
            const sex = document.getElementById('P_Sex').value;
            const weightRaw = document.getElementById('P_Weight').value;
            const weight = weightRaw !== '' ? parseFloat(weightRaw) : null;
            const size = document.getElementById('P_Size').value;
            const ic = document.getElementById('P_IC').value;
            const memo = document.getElementById('P_Memo').value;
            const birthday = document.getElementById('P_Birthday').value;
            const health = buildHealthPayload();
            const wariness = buildWarinessPayload();

            if (!uid || !name) {
                alert("請確認「寵物名稱」已填寫！");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = '資料儲存中...';
            btn.disabled = true;

            const requestData = {
                action: 'insertPet',
                payload: {
                    uid: uid,
                    petId: petId || undefined,
                    name: name,
                    type: type,
                    breeds: breeds,
                    sex: sex,
                    weight: weight,
                    size: size,
                    ic: ic,
                    memo: memo,
                    birthday: birthday,
                    health: health,
                    wariness: wariness
                }
            };

            try {
                const response = await fetch(CONFIG.GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('successModalMessage').innerText =
                        (petId ? '毛小孩的資料已更新完成。' : '毛小孩的資料已新增完成。');
                    document.getElementById('successModal').classList.add('is-visible');

                    setTimeout(async function() {
                        document.getElementById('successModal').classList.remove('is-visible');
                        btn.innerText = '儲存資料';
                        await loadPetList();
                    }, 1200);
                } else {
                    alert('儲存失敗，請檢查資料庫設定：' + JSON.stringify(result.error));
                    btn.innerText = '儲存資料';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('網路連線錯誤，請稍後再試。');
                btn.innerText = '儲存資料';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
