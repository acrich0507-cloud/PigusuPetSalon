<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩美容會員中心</title>
    
    <!-- 引入共用設定檔 -->
    <script src="config.js"></script>
    
    <!-- 引入共用外觀樣式檔 -->
    <link rel="stylesheet" href="style.css">
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="form-container">
        <div id="loading-overlay" class="is-visible">
            <div class="spinner"></div>
            <div class="loading-text">正在讀取您的 LINE 資訊...</div>
        </div>

        <div id="content">
            <h2>專屬會員卡</h2>
            <p id="name-display" class="member-greeting"></p>

            <div class="qrcode-wrapper">
                <div id="qrcode"></div>
            </div>

            <p id="uid-display" class="uid-text"></p>

            <hr class="section-divider">

            <div class="action-stack">
                <button type="button" class="btn" onclick="goToPage('CustomerMaintain.html')">會員資料維護</button>
                <button type="button" class="btn" onclick="goToPage('PetMaintain.html')">毛小孩資料維護</button>
                <button type="button" class="btn btn-secondary" onclick="goToPage('BookingSelect.html')">預約記錄查詢</button>
            </div>
        </div>

        <p id="app-version" class="app-version"></p>
    </div>

    <script>
        let currentUid = ""; 
        let currentName = "";

        document.getElementById('app-version').textContent = `v${CONFIG.APP_VERSION}`;

        async function initApp() {
            try {
                await liff.init({ liffId: CONFIG.LIFF_ID });
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentUid = profile.userId; 
                    currentName = profile.displayName; 
                    checkUserExists(currentUid);
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading-overlay').innerHTML = "<div class='loading-text is-error'>LINE 系統載入失敗，請確認 LIFF ID 是否正確。</div>";
            }
        }

        async function checkUserExists(uid) {
            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=checkUser&uid=${uid}`);
                const result = await response.json();

                if (result.exists === true) {
                    document.getElementById('loading-overlay').classList.remove('is-visible');
                    document.getElementById('content').classList.add('is-visible');
                    document.getElementById('name-display').innerText = `${currentName} 您好！`;
                    document.getElementById('uid-display').innerText = `UID: ${uid}`;
                    
                    // 產生 QR Code
                    document.getElementById("qrcode").innerHTML = ""; 
                    new QRCode(document.getElementById("qrcode"), {
                        text: uid,
                        width: 150,
                        height: 150,
                        colorDark : "#222222",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                } else {
                    window.location.replace(`CustomerMaintain.html?uid=${uid}&name=${encodeURIComponent(currentName)}`);
                }
            } catch (err) {
                console.error("API 呼叫失敗", err);
                document.getElementById('loading-overlay').innerHTML = "<div class='loading-text is-error'>系統連線異常，請稍後再試。</div>";
            }
        }

        function goToPage(pageName) {
            if (!currentUid) {
                alert("尚未取得您的會員資料，請稍後再試！");
                return;
            }
            window.location.href = `${pageName}?uid=${currentUid}&name=${encodeURIComponent(currentName)}`;
        }

        initApp();
    </script>
</body>
</html>
