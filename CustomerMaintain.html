<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員資料維護</title>
    <script src="config.js"></script>
    <!-- 引入共用外觀樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>會員資料維護</h2>
        
        <!-- 優化後的讀取畫面 -->
        <div id="loading-overlay" class="is-visible">
            <div class="spinner"></div>
            <div class="loading-text">資料讀取中，請稍候...</div>
        </div>

        <form id="memberForm" style="display: none;">
            <input type="hidden" id="U_ID">
            <input type="hidden" id="U_LineName">
            
            <div class="form-group">
                <label for="U_Name">姓名<span class="required-star">*</span></label>
                <input type="text" id="U_Name" class="form-control" placeholder="請輸入真實姓名" required>
            </div>

            <div class="form-group">
                <label for="U_Six">性別</label>
                <select id="U_Six" class="form-control">
                    <option value="">請選擇</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="U_Phone">手機號碼<span class="required-star">*</span></label>
                <input type="tel" id="U_Phone" class="form-control" placeholder="09xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="U_Email">Email 電子信箱</label>
                <input type="email" id="U_Email" class="form-control" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label>聯絡地址</label>
                <div class="flex-group">
                    <select id="U_City" class="form-control" onchange="updateDistricts()" style="flex: 1;">
                        <option value="">縣市</option>
                    </select>
                    <select id="U_District" class="form-control" style="flex: 1;">
                        <option value="">區/鄉/鎮</option>
                    </select>
                </div>
                <input type="text" id="U_Street" class="form-control" placeholder="請輸入街道、巷弄與門牌號碼">
            </div>

            <div class="form-group">
                <label>生日</label>
                <div class="flex-group">
                    <select id="U_BirthYear" class="form-control" style="flex: 2;">
                        <option value="">年份</option>
                    </select>
                    <select id="U_BirthMonth" class="form-control" style="flex: 1;">
                        <option value="">月份</option>
                    </select>
                    <select id="U_BirthDay" class="form-control" style="flex: 1;">
                        <option value="">日期</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="U_Memo">個人備註</label>
                <textarea id="U_Memo" class="form-control" placeholder="有什麼偏好的服務想先告訴我們嗎？"></textarea>
            </div>

            <div class="checkbox-container">
                <label class="checkbox-group">
                    <input type="checkbox" id="U_Marketing" checked>
                    <span>我願意接收最新促銷與活動訊息</span>
                </label>
            </div>

            <button type="button" class="btn" id="submitBtn" onclick="submitForm()">儲存資料</button>
        </form>
    </div>

            "雲林縣": ["斗六市", "斗南鎮", "虎尾鎮", "西螺鎮", "土庫鎮", "北港鎮", "古坑鄉", "大埤鄉", "莿桐鄉", "林內鄉", "二崙鄉", "崙背鄉", "麥寮鄉", "東勢鄉", "褒忠鄉", "臺西鄉", "元長鄉", "四湖鄉", "口湖鄉", "水林鄉"],

            "台東縣": ["臺東市", "成功鎮", "關山鎮", "卑南鄉", "大武鄉", "太麻里鄉", "東河鄉", "長濱鄉", "鹿野鄉", "池上鄉", "綠島鄉", "延平鄉", "海端鄉", "達仁鄉", "金峰鄉", "蘭嶼鄉"],
            "澎湖縣": ["馬公市", "湖西鄉", "白沙鄉", "西嶼鄉", "望安鄉", "七美鄉"],
            "金門縣": ["金城鎮", "金湖鎮", "金沙鎮", "金寧鄉", "烈嶼鄉", "烏坵鄉"],

        function initCityDropdown() {
            const citySelect = document.getElementById('U_City');
            for (let city in taiwanDistricts) {
                let option = document.createElement("option");
                option.value = city;
                option.text = city;
                citySelect.appendChild(option);
            }
        }

        function updateDistricts() {
            const citySelect = document.getElementById('U_City');
            const districtSelect = document.getElementById('U_District');
            const selectedCity = citySelect.value;
            
            districtSelect.innerHTML = '<option value="">區/鄉/鎮</option>';
            
            if (selectedCity && taiwanDistricts[selectedCity]) {
                taiwanDistricts[selectedCity].forEach(function(district) {
                    let option = document.createElement("option");
                    option.value = district;
                    option.text = district;
                    districtSelect.appendChild(option);
                });
            }
        }

        function initDateDropdowns() {
            const yearSelect = document.getElementById('U_BirthYear');
            const monthSelect = document.getElementById('U_BirthMonth');
            const daySelect = document.getElementById('U_BirthDay');
            
            const currentYear = new Date().getFullYear();
            for (let i = currentYear; i >= 1930; i--) {
                let option = document.createElement("option");
                option.value = i;
                option.text = i + '年';
                yearSelect.appendChild(option);
            }
            for (let i = 1; i <= 12; i++) {
                let m = i < 10 ? '0' + i : i;
                let option = document.createElement("option");
                option.value = m;
                option.text = m + '月';
                monthSelect.appendChild(option);
            }
            for (let i = 1; i <= 31; i++) {
                let d = i < 10 ? '0' + i : i;
                let option = document.createElement("option");
                option.value = d;
                option.text = d + '日';
                daySelect.appendChild(option);
            }
        }

        function parseAndSetAddress(fullAddress) {
            if (!fullAddress) return;

            let cityMatch = "";
            let districtMatch = "";
            let streetMatch = fullAddress;

            for (let city in taiwanDistricts) {
                let altCity = city.replace('台', '臺');
                let altCity2 = city.replace('臺', '台');
                
                if (fullAddress.startsWith(city) || fullAddress.startsWith(altCity) || fullAddress.startsWith(altCity2)) {
                    cityMatch = city;
                    let matchedStr = fullAddress.startsWith(city) ? city : (fullAddress.startsWith(altCity) ? altCity : altCity2);
                    streetMatch = fullAddress.substring(matchedStr.length);
                    break;
                }
            }

            if (cityMatch) {
                document.getElementById('U_City').value = cityMatch;
                updateDistricts();

                const districts = taiwanDistricts[cityMatch];
                for (let i = 0; i < districts.length; i++) {
                    let dist = districts[i];
                    if (streetMatch.startsWith(dist)) {
                        districtMatch = dist;
                        streetMatch = streetMatch.substring(dist.length);
                        break;
                    }
                }

                if (districtMatch) {
                    document.getElementById('U_District').value = districtMatch;
                }
            }
            
            document.getElementById('U_Street').value = streetMatch;
        }

        function getParamFromUrl(paramName) {
            const params = new URLSearchParams(window.location.search);
            return params.get(paramName);
        }

        window.onload = async function() {
            initCityDropdown();
            initDateDropdowns(); 

            const uid = getParamFromUrl('uid');
            const lineName = getParamFromUrl('name');
            
            if (!uid) {
                document.getElementById('loading-overlay').innerHTML = "<div class='loading-text is-error'>無法取得系統授權碼，請從 LINE 重新進入</div>";
                document.getElementById('loading-overlay').classList.add('is-visible');
                return;
            }

            document.getElementById('U_ID').value = uid;
            
            document.getElementById('loading-overlay').classList.add('is-visible');
            document.getElementById('memberForm').style.display = 'none';

            try {
                const response = await fetch(`${CONFIG.GAS_API_URL}?action=getUserData&uid=${uid}`);
                const result = await response.json();

                if (result.success && result.data) {
                    const dbData = result.data;
                    document.getElementById('U_LineName').value = lineName || dbData.U_LineName || '';
                    document.getElementById('U_Name').value = dbData.U_Name || '';
                    document.getElementById('U_Six').value = dbData.U_Six || '';
                    document.getElementById('U_Phone').value = dbData.U_Phone || '';
                    document.getElementById('U_Email').value = dbData.U_Email || '';
                    
                    parseAndSetAddress(dbData.U_Addr);
                    
                    if (dbData.U_BirthDay) {
                        const parts = dbData.U_BirthDay.split('-');
                        if (parts.length >= 3) {
                            document.getElementById('U_BirthYear').value = parts[0];
                            document.getElementById('U_BirthMonth').value = parts[1];
                            document.getElementById('U_BirthDay').value = parts[2].substring(0, 2); 
                        }
                    }
                    
                    document.getElementById('U_Memo').value = dbData.U_Memo || '';
                    document.getElementById('U_Marketing').checked = dbData.U_Marketing !== false; 
                } else {
                    document.getElementById('U_LineName').value = lineName || '';
                    document.getElementById('U_Name').value = lineName || '';
                }
            } catch (error) {
                console.error("資料讀取失敗:", error);
                document.getElementById('U_LineName').value = lineName || '';
                document.getElementById('U_Name').value = lineName || '';
            } finally {
                document.getElementById('loading-overlay').classList.remove('is-visible');
                document.getElementById('memberForm').style.display = 'block';
            }
        };

        async function submitForm() {
            const uid = document.getElementById('U_ID').value;
            const lineName = document.getElementById('U_LineName').value;
            const name = document.getElementById('U_Name').value;
            const six = document.getElementById('U_Six').value;
            const phone = document.getElementById('U_Phone').value;
            const email = document.getElementById('U_Email').value;
            const memo = document.getElementById('U_Memo').value;
            const marketing = document.getElementById('U_Marketing').checked; 

            const city = document.getElementById('U_City').value;
            const district = document.getElementById('U_District').value;
            const street = document.getElementById('U_Street').value;
            let fullAddr = "";
            if (city || district || street) {
                fullAddr = city + district + street;
            }
            
            const bYear = document.getElementById('U_BirthYear').value;
            const bMonth = document.getElementById('U_BirthMonth').value;
            const bDay = document.getElementById('U_BirthDay').value;
            let birthday = "";
            if (bYear && bMonth && bDay) {
                birthday = `${bYear}-${bMonth}-${bDay}`;
            }
            
            if (!uid || !name || !phone) {
                alert("請確認「真實姓名」與「手機號碼」皆已填寫！");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerText = '資料儲存中...';
            btn.disabled = true;

            const requestData = {
                action: 'insertUser', 
                payload: {
                    uid: uid,
                    lineName: lineName,
                    name: name,
                    six: six,
                    phone: phone,
                    email: email,
                    addr: fullAddr, 
                    birthday: birthday,
                    memo: memo,
                    marketing: marketing
                }
            };

            try {
                const response = await fetch(CONFIG.GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('資料儲存成功！將為您跳轉回會員中心。');
                    window.location.replace('CustomerCenter.html'); 
                } else {
                    alert('儲存失敗，請檢查資料庫設定：' + JSON.stringify(result.error));
                    btn.innerText = '儲存資料';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('網路連線錯誤，請稍後再試。');
                btn.innerText = '儲存資料';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
