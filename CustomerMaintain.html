<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員資料維護</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .form-container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #00B900; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .uid-display { font-size: 12px; color: #888; margin-bottom: 15px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>填寫會員資料</h2>
        <p class="uid-display" id="display-uid">讀取 UID 中...</p>

        <form id="memberForm">
            <!-- 隱藏欄位用來儲存 UID -->
            <input type="hidden" id="U_ID" name="U_ID">

            <div class="form-group">
                <label for="U_Name">姓名</label>
                <input type="text" id="U_Name" name="U_Name" placeholder="請輸入姓名" required>
            </div>

            <div class="form-group">
                <label for="U_Phone">手機號碼</label>
                <input type="tel" id="U_Phone" name="U_Phone" placeholder="09xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="U_BirthDay">生日</label>
                <input type="date" id="U_BirthDay" name="U_BirthDay">
            </div>

            <button type="button" class="btn" onclick="submitForm()">確認送出</button>
        </form>
    </div>

    <script>
        // 從網址中抓取 UID (剛剛首頁跳轉過來時帶上的參數)
        function getUidFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('uid');
        }

        // 頁面載入時執行
        window.onload = function() {
            const uid = getUidFromUrl();
            const lineName = getUidFromUrl('name'); // 🌟 抓取網址上的名稱
            if (uid) {
                document.getElementById('U_ID').value = uid;
                document.getElementById('display-uid').innerText = `您的專屬 ID: ${uid}`;
            } else {
                document.getElementById('display-uid').innerText = "無法取得 UID，請從 LINE 重新進入";
            }
            // 🌟 如果有抓到 LINE 暱稱，就自動填入姓名的 input 欄位中
            if (lineName) {
                document.getElementById('U_Name').value = lineName;
            }
        };


        // 準備送出表單的函式 (GAS 新增邏輯稍後再補上)
        async function submitForm() {
            const uid = document.getElementById('U_ID').value;
            const name = document.getElementById('U_Name').value;
            const phone = document.getElementById('U_Phone').value;
            const birthday = document.getElementById('U_BirthDay').value;

            if (!uid || !name || !phone) {
                alert("請確認姓名與電話皆已填寫！");
                return;
            }

            // 防呆：將按鈕鎖定避免重複點擊
            const btn = document.querySelector('.btn');
            btn.innerText = '資料儲存中...';
            btn.disabled = true;

            // ⚠️ 記得填入你自己的 GAS 網址
            const GAS_API_URL = "https://script.google.com/macros/s/AKfycby-4Ou7OgwVapyrKjVsgx6RWdPwuKTn0aIkdkrTLNw38qnoCLyHldGVOTzIK5gDWhyr7Q/exec"; 

            const requestData = {
                action: 'insertUser',
                payload: {
                    uid: uid,
                    name: name,
                    phone: phone,
                    birthday: birthday
                }
            };

            try {
                // 發送 POST 請求至 GAS
                // 使用 text/plain 避免瀏覽器 CORS 預檢請求 (Preflight) 的問題
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(requestData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('資料建檔成功！馬上為您跳轉回會員中心。');
                    // 註冊成功，導回首頁，這次就能顯示 QR Code 了
                    window.location.replace('CustomerCenter.html'); 
                } else {
                    alert('儲存失敗，請檢查資料庫設定：' + JSON.stringify(result.error));
                    btn.innerText = '確認送出';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('網路連線錯誤，請稍後再試。');
                btn.innerText = '確認送出';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
